---
# Consolidated provisioning playbook for all LXC services.
#
# Run everything:        ansible-playbook -i inventories/homelab playbooks/site.yml --ask-vault-pass
# Run one service:       ansible-playbook -i inventories/homelab playbooks/site.yml --tags immich --ask-vault-pass
# Run a category:        ansible-playbook -i inventories/homelab playbooks/site.yml --tags media --ask-vault-pass
# List available tags:   ansible-playbook -i inventories/homelab playbooks/site.yml --list-tags
#
# Cross-cutting / operational playbooks are kept separate on purpose:
#   base.yml        - base hardening across every LXC
#   alloy.yml       - Grafana Alloy agent across every Debian LXC
#   update-lxc.yml  - rolling package updates

# --- utility ---------------------------------------------------------------
- name: Setup AdGuard Home
  hosts:
    - adguard-primary
    - adguard-secondary
  become: true
  roles:
    - base-alpine
    - docker-alpine
    - adguard
  tags: [adguard, alpine, utility]

- name: Setup AdGuard Sync
  hosts: adguard-sync
  become: true
  roles:
