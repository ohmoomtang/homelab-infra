---
- name: Create Vert data directory
  ansible.builtin.file:
    path: '{{ vert_data_dir }}'
    state: directory
    mode: '0755'

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: '{{ vert_data_dir }}/docker-compose.yml'
    mode: '0644'

- name: Pull and start Vert
  community.docker.docker_compose_v2:
    project_src: '{{ vert_data_dir }}'
    state: present
    pull: missing
