---
- name: Create AdGuard Home work directory
  ansible.builtin.file:
    path: '{{ adguard_home_work_dir }}'
    state: directory
    mode: '0755'

- name: Create AdGuard Home conf directory
  ansible.builtin.file:
    path: '{{ adguard_home_conf_dir }}'
    state: directory
    mode: '0755'

- name: Run AdGuard Home Docker container
  community.docker.docker_container:
    name: adguardhome
    image: 'adguard/adguardhome:{{ adguard_image_tag }}'
    state: started
    restart_policy: unless-stopped
    volumes:
      - '{{ adguard_home_work_dir }}:/opt/adguardhome/work'
      - '{{ adguard_home_conf_dir }}:/opt/adguardhome/conf'
    published_ports:
      - '53:53/tcp'
      - '53:53/udp'
      - '67:67/tcp'
      - '67:67/udp'
      - '68:68/udp'
      - '80:80/tcp'
      - '443:443/tcp'
      - '443:443/udp'
      - '3000:3000/tcp'
      - '853:853/tcp'
      - '784:784/udp'
      - '853:853/udp'
      - '8853:8853/udp'
      - '5443:5443/tcp'
      - '5443:5443/udp'
