---
- name: Allow Alloy metrics port
  community.general.ufw:
    rule: allow
    port: '12345'
    proto: tcp
  when: ansible_os_family == "Debian"

- name: Install Alloy
  ansible.builtin.include_role:
    name: grafana.grafana.alloy
  vars:
    # alloy runs as the unprivileged "alloy" user; it must be in the docker
    # group to read /var/run/docker.sock, otherwise log collection silently
    # fails with "permission denied" and nothing reaches Loki.
    alloy_user_groups:
      - docker
    alloy_env_file_vars:
      CUSTOM_ARGS: '--server.http.listen-addr=0.0.0.0:12345'
    alloy_config: |
      // Metrics
      prometheus.exporter.unix "node" {
        enable_collectors = ["cpu", "diskstats", "filesystem", "loadavg", "meminfo", "netdev", "uname"]
      }

      prometheus.scrape "node" {
        targets    = prometheus.exporter.unix.node.targets
        forward_to = [prometheus.remote_write.prom.receiver]
        job_name   = "node_exporter"
      }

      prometheus.remote_write "prom" {
        endpoint {
          url = "{{ prometheus_endpoint }}"
        }
      }

      // Logs
      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      discovery.relabel "docker" {
        targets = discovery.docker.containers.targets
        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/?(.*)"
          target_label  = "container"
          action        = "replace"
        }
      }

      loki.source.docker "containers" {
        host    = "unix:///var/run/docker.sock"
        targets = discovery.relabel.docker.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        // additive host label so logs can be told apart per host without
        // touching the container / service_name labels the dashboards use
        external_labels = { host = "{{ inventory_hostname }}" }
        endpoint {
          url = "{{ loki_endpoint }}"
        }
      }
