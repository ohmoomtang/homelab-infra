---
- name: Install Docker (Alpine)
  community.general.apk:
    name:
      - docker
      - docker-cli-compose
    state: present

- name: Enable and start Docker service
  ansible.builtin.service:
    name: docker
    enabled: yes
    state: started

- name: Add user to docker group
  ansible.builtin.user:
    name: '{{ ansible_user }}'
    groups: docker
    append: yes
